name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # CI gets its own Postgres rather than the project's Neon database.
    #
    # The save round-trip has to be exercised against a real database — an
    # in-memory store raises the exceptions a test tells it to, which is how a
    # dead retry path went unnoticed once already. A service container gives
    # that for nothing, and no credential of the project's leaves the project.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dowel
          POSTGRES_PASSWORD: dowel
          POSTGRES_DB: dowel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No pooler in front of it, so both URLs are the same connection. The
      # distinction that matters in production — pooled for requests, direct
      # for migrations — is a property of Neon, not of the code.
      DATABASE_URL: postgresql://dowel:dowel@localhost:5432/dowel
      DIRECT_URL: postgresql://dowel:dowel@localhost:5432/dowel

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generated GraphQL types are current
        run: npm run codegen:check

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: First-load JS budget
        run: npm run measure:bundle

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The deployed site, checked against the real URL.
  #
  # Local verification is not verification. Everything this repository measures
  # locally can be true while the deployed site is broken, and that is not
  # hypothetical here: the site was live and answering for two days with
  # `database: false`, because the Vercel project had no connection string, and
  # nothing in CI knew.
  #
  # It runs after the rest has passed, and only on main, because a pull request
  # has not been deployed yet.
  deployed:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      DEPLOYED_URL: ${{ vars.DEPLOYED_URL || 'https://dowel-configurator.vercel.app' }}
      # The commit this run is for. The check waits for the live site to report
      # it before asserting anything: Vercel builds asynchronously, so without
      # this the job races the deployment and passes against the previous one
      # — green, stable, and measuring the wrong artifact.
      EXPECTED_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check the deployed site
        run: npm run check:deployed
